<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go2upSkills - Register</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body style="overflow-y: scroll;">
    <div id="menu-container"></div>

    <div class="container">
        <h1 class="my-4 text-primary text-center">Register</h1>
        <div class="col-lg-6 mx-auto rounded">
            <form class="row">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Full Name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="email" placeholder="+66 xx xxx xxxx" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Course</label>
                    <select class="form-select" aria-label="Default select example" required>
                        <option value="" selected>Please Select...</option>
                        <option value="1">Course 1</option>
                        <option value="2">Course 2</option>
                        <option value="3">Course 3</option>
                        <option value="4">Course 4</option>
                        <option value="5">Course 5</option>
                        <option value="6">Course 6</option>
                        <option value="7">Course 7</option>
                        <option value="8">Course 8</option>
                    </select>
                </div>

                <div class="mb-4">
                    <input type="submit" id="submit" class="btn btn-primary" value="Register">
                </div>
            </form>
        </div>

    </div>

    <div id="footer-container"></div>

    <script src="js/menu.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
